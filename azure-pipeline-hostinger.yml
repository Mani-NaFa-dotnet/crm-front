trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'crm-frontend'
  registry: 'registry.nafabarter.com'
  fullImageName: '$(registry)/$(imageName)'
  tag: '$(Build.BuildId)'

steps:

- task: Docker@2
  displayName: 'Build and push $(imageName)'
  inputs:
    command: buildAndPush
    containerRegistry: 'nafa-registry'
    repository: '$(imageName)'
    Dockerfile: 'Dockerfile'
    tags: |
      latest
      $(tag)
    
- script: |
    curl -X POST -k https://89.116.20.215:9443/api/stacks/webhooks/a77005b0-989a-4f41-8a89-34ac35c4806e
  displayName: 'Trigger Portainer webhook'
  condition: succeeded()